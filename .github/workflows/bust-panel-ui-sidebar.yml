name: Bust Panel UI Sidebar Cache
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/bust-panel-ui-sidebar.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - run: python3 .github/scripts/bust_panel_ui_sidebar.py
      - run: git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/frontend/*.html
          git commit -m "fix(ui): bust sidebar cache for panel refresh"
          git push origin HEAD:l2tp-dev
