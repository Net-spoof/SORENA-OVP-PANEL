name: Refresh implicit client defaults assets

on:
  push:
    paths:
      - .github/workflows/refresh-implicit-client-defaults.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2tp-dev
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Refresh clients asset version
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('webpanel/frontend/clients.html')
          text = path.read_text(encoding='utf-8')
          old = 'js/delegated-portal.js?v=delegated-portal-20260911-v3'
          new = 'js/delegated-portal.js?v=delegated-portal-20260915-v4'

          if new in text:
              print('asset version already refreshed')
          else:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one old asset reference, got {text.count(old)}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify implicit defaults implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'js/delegated-portal.js?v=delegated-portal-20260915-v4' webpanel/frontend/clients.html
          grep -Fq 'function chooseImplicitServerConfiguration(select)' webpanel/frontend/js/delegated-portal.js
          grep -Fq 'wrapper.style.display = '\''none'\''' webpanel/frontend/js/delegated-portal.js
          grep -Fq 'option => option && option.value && !option.disabled' webpanel/frontend/js/delegated-portal.js
          git diff --check

      - name: Commit clients page through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git rev-parse HEAD:webpanel/frontend/clients.html)"
          export SOURCE_SHA
          python3 - <<'PY' > /tmp/update.json
          import base64, json, os
          from pathlib import Path

          raw = Path('webpanel/frontend/clients.html').read_bytes()
          print(json.dumps({
              'message': 'fix(clients): refresh implicit server configuration asset',
              'content': base64.b64encode(raw).decode('ascii'),
              'sha': os.environ['SOURCE_SHA'],
              'branch': 'l2tp-dev',
          }))
          PY

          curl --fail-with-body -sS -L \
            -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/webpanel/frontend/clients.html" \
            --data-binary @/tmp/update.json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["commit"]["sha"])'
