name: Expose authoritative client usage

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - .github/workflows/client-usage-authority.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Add authoritative usage field
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('webpanel/backend/api.go')
          text = p.read_text(encoding='utf-8')
          if 'globalUsageTotals := delegatedGlobalUsageMap()' not in text:
              needle = '\ttrafficStats, err := trafficDB.GetCurrentClientStats()\n\tcumulativeTotals := trafficDB.loadCumulativeTotalsMap()\n'
              replacement = needle + '\tglobalUsageTotals := delegatedGlobalUsageMap()\n'
              if text.count(needle) != 1:
                  raise SystemExit(f'expected one traffic setup block, found {text.count(needle)}')
              text = text.replace(needle, replacement, 1)
          if 'clientMap["traffic_used_bytes"] = authoritativeUsed' not in text:
              needle = '\t\t\t\tif name, ok := clientMap["name"].(string); ok {\n'
              addition = '\t\t\t\t\tif authoritativeUsed, exists := globalUsageTotals[strings.ToLower(strings.TrimSpace(name))]; exists {\n\t\t\t\t\t\tclientMap["traffic_used_bytes"] = authoritativeUsed\n\t\t\t\t\t}\n'
              if text.count(needle) != 1:
                  raise SystemExit(f'expected one client-name block, found {text.count(needle)}')
              text = text.replace(needle, needle + addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Format and build
        run: |
          cd webpanel/backend
          gofmt -w api.go
          go build ./...

      - name: Verify
        run: |
          grep -q 'globalUsageTotals := delegatedGlobalUsageMap()' webpanel/backend/api.go
          grep -q 'clientMap\["traffic_used_bytes"\] = authoritativeUsed' webpanel/backend/api.go
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webpanel/backend/api.go
          git commit -m 'fix(webpanel): expose authoritative per-client traffic usage'
          git push origin HEAD:l2tp-dev
