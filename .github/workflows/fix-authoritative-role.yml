name: Fix Authoritative Delegated Role

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - '.github/workflows/fix-authoritative-role.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Patch and validate
        run: |
          python3 .github/scripts/fix_authoritative_role.py
          git diff --check

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webpanel/frontend
          git commit -m 'fix(ui): resolve delegated role from backend before rendering'
          git push origin HEAD:l2tp-dev
