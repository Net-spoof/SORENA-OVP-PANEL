name: Apply accounting v4 rollout guard

on:
  push:
    paths:
      - .github/workflows/add-accounting-v4-rollout.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2tp-dev
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply-accounting-v4-rollout.py

      - name: Validate Python accounting
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check psycopg2-binary
          python3 -m py_compile deploy/master/scripts/irangate-pg-usage-tick.py
          python3 deploy/master/scripts/irangate-pg-usage-tick.py --self-test
          grep -Fq 'ACCOUNTING_V4_MARKER' deploy/master/scripts/irangate-pg-usage-tick.py
          grep -Fq 'FIRST_IKEV2_V4_BASELINE_ONLY' deploy/master/scripts/irangate-pg-usage-tick.py
          grep -Fq 'accounting_v4_ikev2_migration_mode' deploy/master/scripts/irangate-pg-usage-tick.py
          git diff --check

      - name: Run backend regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd webpanel/backend
          go test ./... -run 'Test(ExactGlobalUsagePreservesClientCase|CreateClientRejectsCaseInsensitiveCollision|CanonicalNewClientNameIsLowercase)$' -count=1
          go test ./... -run '^$'

      - name: Commit verified rollout guard
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Net-spoof'
          git config user.email 'rezamhm464@gmail.com'
          git add deploy/master/scripts/irangate-pg-usage-tick.py
          git commit -m 'fix: guard IKEv2 accounting key migration against replay'
          timeout 60 git push origin HEAD:l2tp-dev
