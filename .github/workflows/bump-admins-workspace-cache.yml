name: Bump Admins Workspace Cache
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/bump-admins-workspace-cache.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - name: Bump admins CSS cache key
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('webpanel/frontend/admins.html')
          s = p.read_text(encoding='utf-8')
          old = 'css/admins-ui.css?v=admins-ui-20260911-v1'
          new = 'css/admins-ui.css?v=admins-ui-20260911-v2'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old admins CSS ref, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -Fq 'css/admins-ui.css?v=admins-ui-20260911-v2' webpanel/frontend/admins.html
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/frontend/admins.html
          git commit -m 'fix(ui): force fresh full admins workspace'
          git push origin HEAD:l2tp-dev
