        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          branch = 'l2tp-dev'
          token = os.environ['GH_TOKEN']

          files = [
              'deploy/master/scripts/irangate-pg-usage-tick.py',
              'webpanel/backend/delegated_admins.go',
              'webpanel/backend/client_lifecycle.go',
              'webpanel/backend/api.go',
              'webpanel/backend/subscription_global_usage_patch.go',
              'pkg/client/client.go',
              'deploy/master/postgres/schema.sql',
              'webpanel/backend/client_name_identity.go',
              'webpanel/backend/client_name_identity_test.go',
          ]

          def current_blob(path):
              try:
                  return subprocess.check_output(
                      ['git', 'rev-parse', f'HEAD:{path}'], text=True
                  ).strip()
              except subprocess.CalledProcessError:
                  return None

          for path in files:
              raw = Path(path).read_bytes()
              payload = {
                  'message': 'fix: accounting v3 and case-safe client identity',
                  'content': base64.b64encode(raw).decode('ascii'),
                  'branch': branch,
              }
              sha = current_blob(path)
              if sha:
                  payload['sha'] = sha

              url = f'https://api.github.com/repos/{repo}/contents/{path}'
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  method='PUT',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
              print(path, data['commit']['sha'])
          PY
