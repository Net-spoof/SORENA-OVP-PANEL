name: Apply accounting v3 and case-safe identity fixes

on:
  push:
    paths:
      - .github/workflows/fix-accounting-case-identity.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2tp-dev
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Install Python test dependency
        run: python3 -m pip install --disable-pip-version-check psycopg2-binary

      - name: Apply source patch
        run: python3 .github/scripts/apply-accounting-v3-case-safe.py

      - name: Format and validate source
        shell: bash
        run: |
          set -Eeuo pipefail
          gofmt -w webpanel/backend/api.go webpanel/backend/client_lifecycle.go webpanel/backend/delegated_admins.go webpanel/backend/subscription_global_usage_patch.go webpanel/backend/client_name_identity.go webpanel/backend/client_name_identity_test.go pkg/client/client.go
          python3 -m py_compile deploy/master/scripts/irangate-pg-usage-tick.py deploy/master/scripts/irangate-local-status-snapshot.py
          python3 deploy/master/scripts/irangate-pg-usage-tick.py --self-test
          grep -Fq 'source in ("local", "ikev2")' deploy/master/scripts/irangate-pg-usage-tick.py
          grep -Fq 'ACCOUNTING_V3_MARKER' deploy/master/scripts/irangate-pg-usage-tick.py
          grep -Fq 'FIRST_LOCAL_V3_BASELINE_ONLY' deploy/master/scripts/irangate-pg-usage-tick.py
          grep -Fq 'canonicalClientNameForCreate(req.Name)' webpanel/backend/api.go
          grep -Fq 'http.StatusConflict' webpanel/backend/api.go
          grep -Fq 'globalUsageTotals[strings.TrimSpace(name)]' webpanel/backend/api.go
          ! grep -A35 'func fastEnforceGlobalUsage' webpanel/backend/client_lifecycle.go | grep -Fq 'EqualFold'
          grep -Fq 'clients_client_name_lower_uidx' deploy/master/postgres/schema.sql
          git diff --check

      - name: Run Go regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd webpanel/backend
          go test ./... -run 'Test(ExactGlobalUsagePreservesClientCase|CreateClientRejectsCaseInsensitiveCollision|CanonicalNewClientNameIsLowercase)$' -count=1
          go test ./... -run '^$'
          cd ../..
          go test ./pkg/client -run '^$'

      - name: Commit and push verified patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Net-spoof'
          git config user.email 'rezamhm464@gmail.com'
          git add deploy/master/scripts/irangate-pg-usage-tick.py deploy/master/postgres/schema.sql pkg/client/client.go webpanel/backend/api.go webpanel/backend/client_lifecycle.go webpanel/backend/delegated_admins.go webpanel/backend/subscription_global_usage_patch.go webpanel/backend/client_name_identity.go webpanel/backend/client_name_identity_test.go
          git commit -m 'fix: accounting v3 and case-safe client identity'
          timeout 60 git push origin HEAD:l2tp-dev
