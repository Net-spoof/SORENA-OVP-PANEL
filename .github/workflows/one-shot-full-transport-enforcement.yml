name: One-shot Full Transport Enforcement
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/one-shot-full-transport-enforcement.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - name: Apply lifecycle patch
        run: python3 .github/scripts/full_transport_enforcement_patch.py
      - name: Format Go
        run: gofmt -w webpanel/backend/client_lifecycle.go
      - name: Verify source invariants
        run: |
          set -Eeuo pipefail
          FILE='webpanel/backend/client_lifecycle.go'
          grep -Fq 'blockRemoteNodes(clientName)' "$FILE"
          if grep -Fq 'go blockRemoteNodes(clientName)' "$FILE"; then exit 1; fi
          grep -Fq 'ikev2Run("block", clientName)' "$FILE"
          grep -Fq 'func syncBlockedIKEv2Clients(blockedNames []string)' "$FILE"
          grep -Fq 'syncBlockedIKEv2Clients(blockedNames)' "$FILE"
          git diff --check
      - name: Compile backend without running unrelated legacy tests
        run: |
          cd webpanel/backend
          go test -run '^$' ./...
      - name: Commit
        run: |
          set -Eeuo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/backend/client_lifecycle.go
          git commit -m "fix(lifecycle): enforce expiry and quota on every VPN transport"
          git push origin HEAD:l2tp-dev
