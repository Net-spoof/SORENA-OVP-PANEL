name: Dashboard and admin UI metadata

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - .github/workflows/dashboard-admin-ui-metadata.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Expose safe delegated ownership metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('webpanel/backend/api.go')
          text = p.read_text(encoding='utf-8')

          old = '''\t\t\t\t\t\t\tif connLimit, ok := diskData["connection_limit"]; ok {
\t\t\t\t\t\t\t\tclientMap["connection_limit"] = connLimit
\t\t\t\t\t\t\t}
'''
          new = old + '''\t\t\t\t\t\t\tif ownerAdmin, ok := diskData["owner_admin"]; ok {
\t\t\t\t\t\t\t\tclientMap["owner_admin"] = ownerAdmin
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\tif adminSuspended, ok := diskData["admin_suspended"]; ok {
\t\t\t\t\t\t\t\tclientMap["admin_suspended"] = adminSuspended
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\tif suspendReason, ok := diskData["admin_suspend_reason"]; ok {
\t\t\t\t\t\t\t\tclientMap["admin_suspend_reason"] = suspendReason
\t\t\t\t\t\t\t}
\t\t\t\t\t\t\tif persistedStatus, ok := diskData["status"]; ok {
\t\t\t\t\t\t\t\tclientMap["persisted_status"] = persistedStatus
\t\t\t\t\t\t\t}
'''

          if text.count(old) != 1:
              raise SystemExit(f'expected one connection_limit metadata block, found {text.count(old)}')

          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Format and build backend
        shell: bash
        run: |
          cd webpanel/backend
          gofmt -w api.go
          go build ./...

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ('dashboard.html', 'admins.html'):
              text = Path('webpanel/frontend', name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
              inline = '\n'.join(s for s in scripts if s.strip())
              Path('/tmp/' + name + '.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/dashboard.html.js
          node --check /tmp/admins.html.js

      - name: Verify UI invariants
        shell: bash
        run: |
          grep -q 'Active Users' webpanel/frontend/dashboard.html
          grep -q 'Online Now' webpanel/frontend/dashboard.html
          grep -q 'Has remaining traffic and valid time' webpanel/frontend/dashboard.html
          grep -q 'Traffic Used / Total' webpanel/frontend/admins.html
          grep -q 'openAdminDetails' webpanel/frontend/admins.html
          grep -q 'owner_admin' webpanel/backend/api.go
          git diff --check

      - name: Commit backend metadata support
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webpanel/backend/api.go
          git commit -m 'feat(webpanel): expose delegated owner metadata for admin drilldown'
          git push origin HEAD:l2tp-dev
