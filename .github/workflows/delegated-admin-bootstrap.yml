name: Integrate delegated admin feature

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - .github/workflows/delegated-admin-bootstrap.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Repair integration matcher
        run: python3 .github/scripts/fix_delegated_integration_match.py

      - name: Apply integration patch
        run: python3 .github/scripts/integrate_delegated_admin.py

      - name: Format and compile backend
        run: |
          gofmt -w webpanel/backend/delegated_admins.go webpanel/backend/api.go
          cd webpanel/backend
          go test -run '^$' ./...

      - name: JavaScript syntax checks
        run: |
          node --check webpanel/frontend/js/api.js
          node --check webpanel/frontend/js/sidebar.js

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit integrated feature
        run: |
          if git diff --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/integrate_delegated_admin.py \
                  webpanel/backend/api.go \
                  webpanel/backend/delegated_admins.go \
                  webpanel/frontend/index.html \
                  webpanel/frontend/js/api.js \
                  webpanel/frontend/js/sidebar.js \
                  deploy/master/scripts/irangate-backup-v2-export.py \
                  deploy/master/scripts/irangate-backup-v2-import.py
          git commit -m "feat(webpanel): integrate delegated admin quotas and isolation"
          git push origin HEAD:l2tp-dev
