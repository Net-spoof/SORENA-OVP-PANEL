name: Apply node client download fix

on:
  push:
    paths:
      - .github/workflows/fix-node-client-download.yml

permissions:
  contents: write

concurrency:
  group: node-client-download-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2tp-dev
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Patch node client create/download flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('webpanel/backend/api.go')
          text = path.read_text()

          fixed_markers = (
              'payload, err := json.Marshal(map[string]string{"name": clientName})',
              'func ensureClientOnNode(node NodeConfig, clientName string) error {',
              '"Node client create failed: "+err.Error()',
          )

          if all(marker in text for marker in fixed_markers):
              print('Source is already patched; no source edit needed.')
              raise SystemExit(0)

          lines = text.splitlines(keepends=True)

          create_matches = [
              i for i, line in enumerate(lines)
              if 'body := strings.NewReader(fmt.Sprintf(' in line and 'clientName' in line
          ]
          if len(create_matches) != 1:
              raise SystemExit(f'create request body: expected 1 match, got {len(create_matches)}')

          i = create_matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              f'{indent}payload, err := json.Marshal(map[string]string{{"name": clientName}})\n',
              f'{indent}if err != nil {{\n',
              f'{indent}\treturn fmt.Errorf("encode node create request: %w", err)\n',
              f'{indent}}}\n',
              '\n',
              f'{indent}body := strings.NewReader(string(payload))\n',
          ]

          ensure_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == 'func ensureClientOnNode(node NodeConfig, clientName string) {'
          ]
          if len(ensure_matches) != 1:
              raise SystemExit(f'ensureClientOnNode: expected 1 match, got {len(ensure_matches)}')

          i = ensure_matches[0]
          if i + 2 >= len(lines) or lines[i + 1].strip() != '_ = createClientOnNode(node, clientName)' or lines[i + 2].strip() != '}':
              raise SystemExit('ensureClientOnNode body is not in the expected pre-fix form')
          lines[i:i+3] = [
              'func ensureClientOnNode(node NodeConfig, clientName string) error {\n',
              '\treturn createClientOnNode(node, clientName)\n',
              '}\n',
          ]

          download_matches = [
              i for i, line in enumerate(lines)
              if line.strip() == 'ensureClientOnNode(node, clientName)'
          ]
          if len(download_matches) != 1:
              raise SystemExit(f'download ensure call: expected 1 match, got {len(download_matches)}')

          i = download_matches[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              f'{indent}if err := ensureClientOnNode(node, clientName); err != nil {{\n',
              f'{indent}\thttp.Error(\n',
              f'{indent}\t\tw,\n',
              f'{indent}\t\t"Node client create failed: "+err.Error(),\n',
              f'{indent}\t\thttp.StatusBadGateway,\n',
              f'{indent}\t)\n',
              f'{indent}\treturn\n',
              f'{indent}}}\n',
          ]

          path.write_text(''.join(lines))
          PY

          gofmt -w webpanel/backend/api.go

      - name: Verify patched source
        shell: bash
        run: |
          grep -F 'payload, err := json.Marshal(map[string]string{"name": clientName})' webpanel/backend/api.go
          grep -F 'func ensureClientOnNode(node NodeConfig, clientName string) error {' webpanel/backend/api.go
          grep -F 'Node client create failed:' webpanel/backend/api.go
          if grep -F 'fmt.Sprintf(`{\"name\":%q}`, clientName)' webpanel/backend/api.go; then
            echo 'Old malformed JSON builder still exists' >&2
            exit 1
          fi

      - name: Compile-test backend
        working-directory: webpanel/backend
        run: go test ./... -run '^$'

      - name: Build backend
        working-directory: webpanel/backend
        run: go build ./...

      - name: Commit source fix through GitHub API
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- webpanel/backend/api.go; then
            echo 'Source already fixed on branch.'
            exit 0
          fi

          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          branch = 'l2tp-dev'
          repo_path = 'webpanel/backend/api.go'
          local_path = Path(repo_path)
          api = f'https://api.github.com/repos/{repo}/contents/{repo_path}'

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'irangate-node-download-fix',
          }

          def get_remote():
              url = api + '?' + urllib.parse.urlencode({'ref': branch})
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          remote = get_remote()
          content = base64.b64encode(local_path.read_bytes()).decode('ascii')
          payload = json.dumps({
              'message': 'fix: create node client before subscription download',
              'content': content,
              'sha': remote['sha'],
              'branch': branch,
          }).encode('utf-8')

          req = urllib.request.Request(api, data=payload, headers=headers, method='PUT')
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.load(resp)
              print('Committed source fix:', result['commit']['sha'])
          except urllib.error.HTTPError as exc:
              if exc.code != 409:
                  raise
              latest = get_remote()
              remote_text = base64.b64decode(latest['content']).decode('utf-8')
              markers = (
                  'payload, err := json.Marshal(map[string]string{"name": clientName})',
                  'func ensureClientOnNode(node NodeConfig, clientName string) error {',
                  '"Node client create failed: "+err.Error()',
              )
              if all(marker in remote_text for marker in markers):
                  print('Concurrent writer already committed the same fix.')
              else:
                  raise
          PY
