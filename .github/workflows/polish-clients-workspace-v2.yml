name: Polish Clients Workspace V2
on:
  push:
    branches: [l2tp-dev]
    paths:
      - '.github/workflows/polish-clients-workspace-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - name: Apply clients workspace patch
        run: python3 .github/scripts/polish_clients_workspace_v2.py
      - name: Verify
        run: |
          set -Eeuo pipefail
          grep -Fq 'css/clients-ui.css?v=clients-ui-20260911-v2' webpanel/frontend/clients.html
          grep -Fq 'Plan / Remaining' webpanel/frontend/clients.html
          grep -Fq 'id="clientStatTotal"' webpanel/frontend/clients.html
          grep -Fq 'function updateClientWorkspaceSummary()' webpanel/frontend/clients.html
          grep -Fq '/* NET SPOOF client workspace v2 */' webpanel/frontend/css/clients-ui.css
          git diff --check
      - name: Commit
        run: |
          set -Eeuo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/frontend/clients.html webpanel/frontend/css/clients-ui.css
          git commit -m 'feat(ui): make clients workspace admin friendly'
          git push origin HEAD:l2tp-dev
