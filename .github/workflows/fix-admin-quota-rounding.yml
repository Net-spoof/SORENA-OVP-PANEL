name: Fix admin quota rounding

on:
  push:
    branches: [l2tp-dev]
    paths: [.github/workflows/fix-admin-quota-rounding.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - name: Preserve decimal quota precision
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('webpanel/frontend/admins.html')
          text = p.read_text(encoding='utf-8')
          old = "            const rounded = amount >= 100 ? amount.toFixed(0) : amount >= 10 ? amount.toFixed(1) : amount.toFixed(2);"
          new = "            const rounded = amount.toFixed(2);"
          if text.count(old) != 1:
              raise SystemExit(f'rounding line count={text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -q "const rounded = amount.toFixed(2);" webpanel/frontend/admins.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webpanel/frontend/admins.html
          git commit -m 'fix(ui): preserve delegated quota display precision'
          git push origin HEAD:l2tp-dev
