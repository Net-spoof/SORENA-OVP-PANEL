name: Fix Sidebar Brand NET SPOOF
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/fix-sidebar-brand-nspoof.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - run: python3 .github/scripts/fix_sidebar_brand_nspoof.py
      - run: node --check webpanel/frontend/js/sidebar.js
      - run: git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/frontend/js/sidebar.js webpanel/frontend/*.html
          git commit -m "fix(ui): brand sidebar as NET SPOOF"
          git push origin HEAD:l2tp-dev
