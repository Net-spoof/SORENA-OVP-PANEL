name: Delegated Portal Integration

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - ".github/workflows/delegated-portal-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Patch and validate
        run: python3 .github/scripts/delegated_portal_patch.py

      - name: Check diff
        run: git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webpanel/frontend/js/api.js webpanel/frontend/index.html webpanel/frontend/clients.html webpanel/frontend/dealer-dashboard.html webpanel/frontend/usage.html
          git commit -m "feat(ui): integrate delegated dashboard clients and usage portal"
          git push origin HEAD:l2tp-dev
