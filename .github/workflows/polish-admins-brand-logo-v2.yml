name: Polish NET SPOOF Logo and Admins UI V2
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/polish-admins-brand-logo-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - name: Fix helper modal variable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/polish_admins_brand_logo.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const modal = document.getElementById('detailsModal');", "const detailsModalEl = document.getElementById('detailsModal');")
          s = s.replace("modal.classList.remove('hidden');", "detailsModalEl.classList.remove('hidden');")
          s = s.replace("modal.classList.add('flex');", "detailsModalEl.classList.add('flex');")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 .github/scripts/polish_admins_brand_logo.py
      - name: Check JavaScript syntax
        run: |
          node --check webpanel/frontend/js/sidebar.js
          node --check webpanel/frontend/js/delegated-portal.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('webpanel/frontend/admins.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          Path('/tmp/admins-inline.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/admins-inline.js
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/scripts/polish_admins_brand_logo.py webpanel/frontend
          git commit -m "feat(ui): use NET SPOOF logo and speed up admins page"
          git push origin HEAD:l2tp-dev
