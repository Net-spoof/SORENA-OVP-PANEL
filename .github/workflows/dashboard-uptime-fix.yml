name: Fix dashboard uptime null error

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - .github/workflows/dashboard-uptime-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Guard missing uptime element
        shell: bash
        run: |
          FILE='webpanel/frontend/dashboard.html'
          OLD="document.getElementById('uptime').textContent = formatUptime(stats.uptime / 1000000000);"
          NEW="const uptimeEl = document.getElementById('uptime'); if (uptimeEl) uptimeEl.textContent = formatUptime(stats.uptime / 1000000000);"
          grep -Fq "$OLD" "$FILE"
          sed -i "s#${OLD}#${NEW}#" "$FILE"
          grep -Fq "const uptimeEl = document.getElementById('uptime')" "$FILE"
          git diff --check

      - name: Commit dashboard fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webpanel/frontend/dashboard.html
          git commit -m 'fix(ui): guard missing dashboard uptime element'
          git push origin HEAD:l2tp-dev
