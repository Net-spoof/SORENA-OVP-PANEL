name: Refine local accounting v3 migration

on:
  push:
    paths:
      - .github/workflows/refine-accounting-v3.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout l2tp-dev
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Apply precise migration guard
        run: python3 .github/scripts/refine-accounting-v3.py

      - name: Validate Python accounting
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check psycopg2-binary
          python3 -m py_compile deploy/master/scripts/irangate-pg-usage-tick.py
          python3 deploy/master/scripts/irangate-pg-usage-tick.py --self-test
          grep -Fq 'local_v3_legacy_source_present = False' deploy/master/scripts/irangate-pg-usage-tick.py
          grep -Fq "WHERE source_id = 'local'" deploy/master/scripts/irangate-pg-usage-tick.py
          grep -Fq 'source == "local" and local_session_v3_migration and local_v3_legacy_source_present' deploy/master/scripts/irangate-pg-usage-tick.py
          git diff --check

      - name: Run backend regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd webpanel/backend
          go test ./... -run 'Test(ExactGlobalUsagePreservesClientCase|CreateClientRejectsCaseInsensitiveCollision|CanonicalNewClientNameIsLowercase)$' -count=1
          go test ./... -run '^$'

      - name: Commit verified migration refinement
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Net-spoof'
          git config user.email 'rezamhm464@gmail.com'
          git add deploy/master/scripts/irangate-pg-usage-tick.py
          git commit -m 'fix: baseline local v3 only for legacy accounting row'
          timeout 60 git push origin HEAD:l2tp-dev
