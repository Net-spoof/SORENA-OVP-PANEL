name: IKEv2 credential integrity
on:
  pull_request:
    paths:
      - 'deploy/master/ikev2/irangate-ikev2'
      - 'webpanel/backend/api.go'
      - 'webpanel/backend/client_rework.go'
      - 'scripts/audit-ikev2-credential-parity.py'
      - 'scripts/test-ikev2-credential-integrity.sh'
      - 'scripts/backup-v2/**'
      - 'deploy/master/scripts/irangate-backup-v2-*.py'
      - 'scripts/upgrade-surena-master-safe.sh'
      - '.github/workflows/ikev2-credential-integrity.yml'
  push:
    branches:
      - 'fix/ikev2-credential-integrity-20261021'
      - 'fix/ikev2-backup-single-source-20261021'
permissions:
  contents: read
jobs:
  credential-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credential store sandbox test
        run: bash scripts/test-ikev2-credential-integrity.sh
      - name: Guard, exporter and restore contract
        run: |
          python3 scripts/backup-v2/ikev2-credential-guard.py --self-test
          python3 -m py_compile scripts/backup-v2/ikev2-credential-guard.py
          python3 -m py_compile deploy/master/scripts/irangate-backup-v2-export.py
          python3 -m py_compile deploy/master/scripts/irangate-backup-v2-import.py
          bash -n scripts/backup-v2/irangate-backup-v2-import-wrapper
          bash -n scripts/backup-v2/irangate-backup-v2-export-wrapper
          bash -n scripts/upgrade-surena-master-safe.sh
          python3 - <<'PY'
          from pathlib import Path
          exp = Path("deploy/master/scripts/irangate-backup-v2-export.py").read_text()
          imp = Path("scripts/backup-v2/irangate-backup-v2-import-wrapper").read_text()
          upgrade = Path("scripts/upgrade-surena-master-safe.sh").read_text()
          assert 'fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)' in exp
          assert '--snapshot", str(root)' in exp
          assert 'restore_item /etc/swanctl/conf.d/irangate-ikev2-users.conf' not in imp
          assert 'restore_item /usr/local/sbin/irangate-ikev2\n' not in imp
          assert '/usr/local/sbin/irangate-ikev2 reload' in imp
          assert 'irangate-ikev2-backup-guard' in upgrade
          print("IKEV2_BACKUP_CONTRACT=PASS")
          PY
      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l webpanel/backend/api.go webpanel/backend/client_rework.go)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: webpanel/backend/go.mod
          cache-dependency-path: webpanel/backend/go.sum
      - name: Compile backend tests
        working-directory: webpanel/backend
        run: go test ./... -run '^$'
