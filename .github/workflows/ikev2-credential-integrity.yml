name: IKEv2 credential integrity
on:
  pull_request:
    paths:
      - 'deploy/master/ikev2/irangate-ikev2'
      - 'webpanel/backend/api.go'
      - 'webpanel/backend/client_rework.go'
      - 'scripts/audit-ikev2-credential-parity.py'
      - 'scripts/test-ikev2-credential-integrity.sh'
      - '.github/workflows/ikev2-credential-integrity.yml'
  push:
    branches:
      - 'fix/ikev2-credential-integrity-20261021'
permissions:
  contents: read
jobs:
  credential-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Credential store sandbox test
        run: bash scripts/test-ikev2-credential-integrity.sh
      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l webpanel/backend/api.go webpanel/backend/client_rework.go)"
      - uses: actions/setup-go@v6
        with:
          go-version-file: webpanel/backend/go.mod
          cache-dependency-path: webpanel/backend/go.sum
      - name: Compile backend tests
        working-directory: webpanel/backend
        run: go test ./... -run '^$'
