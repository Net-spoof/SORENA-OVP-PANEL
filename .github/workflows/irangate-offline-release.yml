name: Build and publish complete offline SURENA releases

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - .github/workflows/irangate-offline-release.yml
      - scripts/offline/**
      - scripts/offline-install-panel.sh
      - scripts/make-offline-panel-bundle.sh
      - scripts/irangate-routing
      - scripts/ovp-panel
      - node/**
      - deploy/master/scripts/**
      - deploy/master/systemd/**
      - deploy/master/ikev2/**
      - install.sh
      - scripts/repair-surena-telegram-backup-branding.sh
      - scripts/upgrade-surena-master-safe.sh
      - README.md
      - webpanel/frontend/**
      - webpanel/backend/**
      - pkg/menu/menu.go
      - pkg/cmd/root.go
  pull_request:
    branches:
      - l2tp-dev
    paths:
      - .github/workflows/irangate-offline-release.yml
      - scripts/offline/**
      - scripts/irangate-routing
      - docs/OFFLINE-RELEASE.md
      - README.md
      - webpanel/frontend/**
      - webpanel/backend/**
      - pkg/menu/menu.go
      - pkg/cmd/root.go
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netspoof-offline-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Offline master - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: true
          cache-dependency-path: |
            go.sum
            webpanel/backend/go.sum

      - name: Install builder prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils rsync python3-pip gh

      - name: Build offline bundle and simulate offline APT dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          CI: 'true'
          OUT_DIR: ${{ runner.temp }}/built
        run: |
          bash scripts/offline/build-release-bundle.sh
          ls -lh "$OUT_DIR"

      - name: Validate self-extracting file marker and shell header
        env:
          OUT_DIR: ${{ runner.temp }}/built
        run: |
          bash -n scripts/offline/install-master-from-bundle.sh
          bash -n scripts/offline/build-release-bundle.sh
          python3 -m py_compile scripts/irangate-routing
          python3 -m py_compile deploy/master/scripts/irangate-local-status-snapshot.py deploy/master/scripts/irangate-node-usage-sync.py deploy/master/scripts/irangate-pg-usage-tick.py
          python3 deploy/master/scripts/irangate-local-status-snapshot.py --self-test
          python3 deploy/master/scripts/irangate-node-usage-sync.py --self-test
          python3 deploy/master/scripts/irangate-pg-usage-tick.py --self-test
          bash -n scripts/ovp-panel
          bash -n node/install-node.sh
          bash -n node/install-manager-aliases.sh
          bash -n scripts/repair-surena-telegram-backup-branding.sh
          bash -n scripts/upgrade-surena-master-safe.sh
          grep -Fq 'ln -sfn /usr/local/bin/ovp-panel /usr/local/bin/surena-panel' install.sh
          grep -Fq 'run_stage panel-manager install_panel_manager' scripts/offline/install-master-from-bundle.sh
          grep -Fq 'need surena-panel' scripts/offline/install-master-from-bundle.sh
          grep -Fq 'for alias_name in surena-node serena-node Serena-node' node/install-node.sh
          grep -Fq 'ln -sfn /usr/local/bin/ovp-node "$alias_path"' node/install-node.sh
          node --check webpanel/frontend/js/sidebar.js
          node --check webpanel/frontend/js/i18n.js
          test -s webpanel/frontend/logo/surena.webp
          test ! -e scripts/irangate-gost-tunnel-manager.sh
          grep -q "logo/surena.webp" webpanel/frontend/index.html webpanel/frontend/js/sidebar.js
          grep -Fq '🛡️ SURENA Backup V2' webpanel/backend/telegram_backup_scheduler.go
          grep -Fq 'TestTelegramBackupBrandingSinglePart' webpanel/backend/telegram_backup_scheduler_test.go
          ! grep -q 'IranGate Backup v2' webpanel/backend/telegram_backup_scheduler.go
          bash -n install.sh
          ! grep -Eq 'IranGate Panel Management|IranGate Version|NET SPOOF Panel Management' scripts/ovp-panel webpanel/frontend/settings.html
          sed -n '/^    check_port() {/,/^    }/p' scripts/offline/install-master-from-bundle.sh > "$RUNNER_TEMP/check-port-only.sh"
          bash -c '
            set -Eeuo pipefail
            ss() { :; }
            source "$1"
            check_port udp 443 "" "" OpenVPN
            check_port tcp 443 "" "" OpenVPN
            ! check_port tcp 443 "" "" WebPanel
            ! check_port udp 500 "" "" OpenVPN
          ' bash "$RUNNER_TEMP/check-port-only.sh"
          asset="$(find "$OUT_DIR" -name '*.run' -type f -print -quit)"
          test -n "$asset"
          marker_line="$(awk '$0=="__IRANGATE_BUNDLE_START__" {print NR; exit}' "$asset")"
          test -n "$marker_line"
          head -n "$((marker_line-1))" "$asset" | bash -n
          mkdir -p "$RUNNER_TEMP/offline-smoke"
          tail -n "+$((marker_line+1))" "$asset" | tar -xzf - -C "$RUNNER_TEMP/offline-smoke"
          bash -n "$RUNNER_TEMP/offline-smoke/scripts/offline/install-master-from-bundle.sh"
          test -s "$RUNNER_TEMP/offline-smoke/offline-assets/apt/Packages.gz"
          grep -q 'select_port' "$RUNNER_TEMP/offline-smoke/scripts/offline/install-master-from-bundle.sh"
          grep -q 'run_stage verification' "$RUNNER_TEMP/offline-smoke/scripts/offline/install-master-from-bundle.sh"
          (cd "$OUT_DIR" && sha256sum -c "$(basename "$asset").sha256")

      # Direct Release uploads avoid GitHub Actions artifact-storage quota.
      - name: Upload verified offline bundle to draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUT_DIR: ${{ runner.temp }}/built
        run: |
          set -Eeuo pipefail
          tag="offline-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "SURENA complete offline installer (${GITHUB_SHA:0:12})" \
              --notes "Self-contained offline installation for fresh Ubuntu 22.04/24.04 amd64 Master servers. Install the .run matching your OS after SHA256 verification. Includes SURENA Backup V2 Telegram captions."
          fi
          gh release upload "$tag" "$OUT_DIR"/*.run "$OUT_DIR"/*.sha256 --clobber

  release:
    name: Verify offline assets and publish Release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify both OS packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          tag="offline-${GITHUB_SHA:0:12}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for os in 2204 2404; do
            name="SURENA-offline-ubuntu${os}-amd64.run"
            printf '%s\n' "$assets" | grep -Fxq "$name"
            printf '%s\n' "$assets" | grep -Fxq "$name.sha256"
          done
          gh release edit "$tag" --draft=false
          echo "Published verified SURENA offline installers: $tag"
