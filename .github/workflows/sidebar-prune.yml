name: Prune unused sidebar items

on:
  push:
    branches:
      - l2tp-dev
    paths:
      - .github/workflows/sidebar-prune.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0

      - name: Remove unused sidebar entries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('webpanel/frontend/js/sidebar.js')
          text = p.read_text(encoding='utf-8')

          patterns = [
              r'\n\s*<a href="#" class="menu-item coming-soon" title="V2ray".*?</a>',
              r'\n\s*<a href="#" class="menu-item coming-soon" title="SSH".*?</a>',
              r'\n\s*<a href="ai-core\.html" class="menu-item .*?title="AI Core">.*?</a>',
              r'\n\s*<a href="#" class="menu-item coming-soon" title="Inbound".*?</a>',
              r'\n\s*<!-- Advanced Features Section -->.*?(?=\n\s*<!-- Other Section -->)',
          ]

          expected = ['V2ray', 'SSH', 'AI Core', 'Inbound', 'Advanced/Auto Tunnel']
          for pattern, label in zip(patterns, expected):
              text, count = re.subn(pattern, '', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} block, removed {count}')

          forbidden = ['title="V2ray"', 'title="SSH"', 'title="AI Core"', 'title="Inbound"', 'title="Auto Tunnel"']
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'Forbidden sidebar item still present: {token}')

          p.write_text(text, encoding='utf-8')
          print('Sidebar entries removed successfully')
          PY

      - name: JavaScript syntax check
        run: node --check webpanel/frontend/js/sidebar.js

      - name: Commit sidebar cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webpanel/frontend/js/sidebar.js
          git diff --cached --check
          git commit -m 'ui: remove unused sidebar sections'
          git push origin HEAD:l2tp-dev
