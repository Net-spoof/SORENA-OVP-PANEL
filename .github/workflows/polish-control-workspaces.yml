name: Polish Control Workspaces
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/polish-control-workspaces.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - name: Wire control workspace polish
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          cache = 'css/control-ui.css?v=control-ui-20260912-v1'

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{label}: marker missing in {path}')
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected one marker in {path}, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Clients: edit-client modal polish only; existing client workspace remains intact.
          p = Path('webpanel/frontend/clients.html')
          s = p.read_text(encoding='utf-8')
          if cache not in s:
              marker = '    <link rel="stylesheet" href="css/clients-ui.css?v=clients-ui-20260911-v2">\n'
              if s.count(marker) != 1:
                  raise SystemExit(f'clients css marker count={s.count(marker)}')
              s = s.replace(marker, marker + f'    <link rel="stylesheet" href="{cache}">\n', 1)
          p.write_text(s, encoding='utf-8')

          # Outbounds.
          p = Path('webpanel/frontend/routing.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>IranGate - Outbounds</title>', '<title>Outbounds - NET SPOOF</title>')
          if cache not in s:
              marker = '    <link rel="stylesheet" href="css/loading.css">\n'
              if s.count(marker) != 1:
                  raise SystemExit(f'routing css marker count={s.count(marker)}')
              s = s.replace(marker, marker + f'    <link rel="stylesheet" href="{cache}">\n', 1)
          if '<body class="page-routing bg-gray-100 min-h-screen">' not in s:
              old = '<body class="bg-gray-100 min-h-screen">'
              if s.count(old) != 1:
                  raise SystemExit(f'routing body marker count={s.count(old)}')
              s = s.replace(old, '<body class="page-routing bg-gray-100 min-h-screen">', 1)
          p.write_text(s, encoding='utf-8')

          # Nodes.
          p = Path('webpanel/frontend/nodes.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Nodes - adsvpn</title>', '<title>Nodes - NET SPOOF</title>')
          if cache not in s:
              marker = '    <link rel="stylesheet" href="css/theme-overrides.css">\n'
              if s.count(marker) != 1:
                  raise SystemExit(f'nodes css marker count={s.count(marker)}')
              s = s.replace(marker, marker + f'    <link rel="stylesheet" href="{cache}">\n', 1)
          if '<body class="page-nodes">' not in s:
              if s.count('<body>') != 1:
                  raise SystemExit(f'nodes body marker count={s.count("<body>")}')
              s = s.replace('<body>', '<body class="page-nodes">', 1)
          p.write_text(s, encoding='utf-8')

          # Settings.
          p = Path('webpanel/frontend/settings.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Settings - IranGate</title>', '<title>Settings - NET SPOOF</title>')
          if cache not in s:
              marker = '    <link rel="stylesheet" href="css/theme-overrides.css">\n'
              if s.count(marker) != 1:
                  raise SystemExit(f'settings css marker count={s.count(marker)}')
              s = s.replace(marker, marker + f'    <link rel="stylesheet" href="{cache}">\n', 1)
          if '<body class="page-settings">' not in s:
              if s.count('<body>') != 1:
                  raise SystemExit(f'settings body marker count={s.count("<body>")}')
              s = s.replace('<body>', '<body class="page-settings">', 1)
          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq 'control-ui-20260912-v1' webpanel/frontend/clients.html
          grep -Fq 'class="page-routing bg-gray-100 min-h-screen"' webpanel/frontend/routing.html
          grep -Fq '<title>Outbounds - NET SPOOF</title>' webpanel/frontend/routing.html
          grep -Fq 'class="page-nodes"' webpanel/frontend/nodes.html
          grep -Fq '<title>Nodes - NET SPOOF</title>' webpanel/frontend/nodes.html
          grep -Fq 'class="page-settings"' webpanel/frontend/settings.html
          grep -Fq '<title>Settings - NET SPOOF</title>' webpanel/frontend/settings.html
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/frontend/clients.html webpanel/frontend/routing.html webpanel/frontend/nodes.html webpanel/frontend/settings.html
          git commit -m 'feat(ui): polish edit outbound node and settings workspaces'
          git push origin HEAD:l2tp-dev
