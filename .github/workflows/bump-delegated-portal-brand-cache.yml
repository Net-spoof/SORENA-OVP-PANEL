name: Bump Delegated Portal Brand Cache
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/bump-delegated-portal-brand-cache.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - name: Bump delegated portal cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('webpanel/frontend')
          version = 'delegated-portal-20260911-v2'
          changed = []
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if 'js/delegated-portal.js' not in text:
                  continue
              new = re.sub(r'js/delegated-portal\.js(?:\?v=[^"\']*)?', f'js/delegated-portal.js?v={version}', text)
              if new != text:
                  page.write_text(new, encoding='utf-8')
                  changed.append(str(page))
          if not changed:
              raise SystemExit('no delegated portal references changed')
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if 'js/delegated-portal.js' in text and f'js/delegated-portal.js?v={version}' not in text:
                  raise SystemExit(f'stale delegated portal reference in {page}')
          print('\n'.join(changed))
          PY
      - run: node --check webpanel/frontend/js/delegated-portal.js
      - run: git diff --check
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/frontend/*.html
          git commit -m "fix(ui): force fresh delegated NET SPOOF sidebar"
          git push origin HEAD:l2tp-dev
