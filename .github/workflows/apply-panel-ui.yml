name: Apply Panel UI
on:
  push:
    branches: [l2tp-dev]
    paths: ['.github/workflows/apply-panel-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: l2tp-dev
          fetch-depth: 0
      - run: python3 .github/scripts/apply_panel_ui_refresh.py
      - run: node --check webpanel/frontend/js/sidebar.js
      - run: git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add webpanel/frontend/js/sidebar.js webpanel/frontend/index.html
          git commit -m "feat(ui): refresh panel UX and add NET SPOOF channel badge"
          git push origin HEAD:l2tp-dev
